<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lição6</title>
    <link rel="stylesheet" type="text/css" href="./css/exercicio1.css">
    <link rel="icon" href="./img/icone.png">
</head>
<body class="back">
    <div>
    <div class="container">
        <div class="box">
    <h6>Trapézio</h6>
    <label>Digite o valor da base maior:</label>
    <input class="texto" id="trapbM" type="number" name="bM" placeholder="Digite o valor da base maior">
    <label>Digite o valor da base menor:</label>
    <input class="texto" id="trapbm" type="number" name="bm" placeholder="Digite o valor da base menor">
    <label>Digite o valor da altura:</label>
    <input class="texto" id="traph" type="number" name="h" placeholder="Digite o valor da altura">
    <input class="botao" id="bot1" type="submit">
    <p id="text1"></p>
    <br><br>

    <h6>Círculo</h6>
    <label>Digite o valor do raio do circulo:</label>
    <input class="texto" id="cirR" type="number" name="cirR" placeholder="Digite o valor do raio do circulo">
    <input class="botao" id="bot2" type="submit">
    <p id="text2"></p>
    <br><br>

    <h6>Triângulo</h6>
    <label>Digite o valor da base:</label>
    <input class="texto" id="triB" type="number" name="triB" placeholder="Digite o valor da base">
    <label>Digite o valor da altura:</label>
    <input class="texto" id="triH" type="number" name="triH" placeholder="Digite o valor da altura">
    <input class="botao" id="bot3" type="submit">
    <p id="text3"></p>
    <br><br>

    <h6>Quadrado</h6>
    <label>Digite o valor de um lado:</label>
    <input class="texto" id="quadL" type="number" name="quadL" placeholder="Digite o valor de um lado">
    <input class="botao" id="bot4" type="submit">
    <p id="text4"></p>
    <br><br>

    <h6>Losango</h6>
    <label>Digite o valor da diagonal maior:</label>
    <input class="texto" id="losandM" type="number" name="dM" placeholder="Digite o valor da diagonal maior">
    <label>Digite o valor da diagonal menor:</label>
    <input class="texto" id="losandm" type="number" name="dm" placeholder="Digite o valor da diagonal menor">
    <input class="botao" id="bot5" type="submit">
    <p id="text5"></p>
    <br><br>
    
    <h6>Retangulo</h6>
    <label>Digite o valor da base:</label>
    <input class="texto" id="retB" type="number" name="retB" placeholder="Digite o valor da base">
    <label>Digite o valor da altura:</label>
    <input class="texto"id="retH" type="number" name="retH" placeholder="Digite o valor da altura">
    <input class="botao" id="bot6" type="submit">
    <p id="text6"></p>
        </div>
    </div>
</div>
    <script type="text/javascript" src="./js/Lição6.js"></script>

</body>
</html>
